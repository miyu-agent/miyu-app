# 打安装包（施工 DT-6，图纸 app.md「装在哪」）：照 pins.toml 取核心、网页软件编 release，搭好内容，Tauri 的打包工具打包
# （施工 AP-2 起程序不再是 Tauri 的，打包工具照旧用它的）。
# step/ 分支、手动触发只打包、传到这次运行的附件里（出包手测）；打 v 开头的 tag 才建发版（预发布，没签名）。
# 第五批审计 D5-3：编、打包的任务只拿读权限，checkout 不把令牌留在磁盘上（核心、网页、tauri-cli 几百个依赖的构建脚本都在
# 这个任务里跑）；只有最后传发版的小任务拿写权限，它不检出、不编东西。外部 action 按提交号钉，后面注明是哪个标签。
name: 打包

on:
  push:
    branches: ["step/**"]
    tags: ["v*"]
    # 只改文档的不重新打包（tag 照打）。
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            config: packaging/linux.json
          - os: macos-latest
            config: packaging/macos.json
          - os: windows-latest
            config: packaging/windows.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 读钉的版本
        id: pins
        shell: bash
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import tomllib
          pins = tomllib.load(open('pins.toml', 'rb'))
          for part in ('core', 'web'):
              print(f"{part}-repo={pins[part]['repo']}")
              print(f"{part}-rev={pins[part]['rev']}")
          EOF
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ steps.pins.outputs.core-repo }}
          ref: ${{ steps.pins.outputs.core-rev }}
          path: _core
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ steps.pins.outputs.web-repo }}
          ref: ${{ steps.pins.outputs.web-rev }}
          path: _web
      - name: 装托盘要的系统库
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev rpm
      - name: 装三个仓库各自钉住的工具链
        shell: bash
        run: |
          rustup toolchain install
          (cd _core && rustup toolchain install)
          (cd _web && rustup toolchain install)
      - name: 取编译缓存
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' }}
          add-rust-environment-hash-key: false
          key: pack
          workspaces: |
            .
            _core
            _web
      - name: 编核心
        working-directory: _core
        run: cargo build --release --locked -p miyu -p miyu-sandbox -p miyu-extract
      - name: 编网页软件
        working-directory: _web
        run: cargo build --release --locked -p miyu-web
      - name: 搭安装包的内容
        shell: bash
        run: |
          python3 packaging/stage.py --core _core --web _web --triple "$(rustc -vV | sed -n 's/^host: //p')" --out dist
      - name: 包里的核心照常起得来
        shell: bash
        run: |
          for p in dist/binaries/miyu-*; do case "$p" in *miyu-sandbox*|*miyu-extract*) ;; *) "$p" --version ;; esac; done
          cat dist/pins.txt
      - name: 装 Tauri 的打包工具
        run: cargo install tauri-cli --version =2.12.4 --locked
      # 程序不再是 Tauri 的（施工 AP-2）：`cargo tauri build` 编的时候总要带 `tauri/custom-protocol` 这个特性，没有 tauri 依赖就编不过。
      # 自己编 release，再只用它的打包（`tauri bundle` 照 mainBinaryName 找编好的 target/release/miyu-app）。
      - name: 编托盘程序
        run: cargo build --release --locked
      - name: 打包
        run: cargo tauri bundle --ci --config ${{ matrix.config }}
      - name: 收安装包
        shell: bash
        run: |
          mkdir -p out
          find target/release/bundle \( -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.msi' \) -exec cp {} out/ \;
          ls -la out
          test -n "$(ls out)"
      - name: 填 AUR 的 PKGBUILD
        if: runner.os == 'Linux'
        shell: bash
        run: |
          deb=$(ls out/*.deb)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          sum=$(sha256sum "$deb" | cut -d' ' -f1)
          # 只换这两行（第五批审计 D5-7：原来连注释里的占位符也换了）；换完还有占位符的算错。
          sed -e "s/^pkgver=@VERSION@\$/pkgver=$version/" -e "s/^sha256sums=('@SHA256@')\$/sha256sums=('$sum')/" packaging/aur/PKGBUILD.in > out/PKGBUILD
          if grep -nE '@(VERSION|SHA256)@' out/PKGBUILD; then echo "PKGBUILD 里还有没填的占位符"; exit 1; fi
          grep -qx "pkgver=$version" out/PKGBUILD
          grep -qx "sha256sums=('$sum')" out/PKGBUILD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: miyu-app-${{ runner.os }}
          path: out/*
          if-no-files-found: error
          retention-days: 14
      - name: 留下钉的版本给发版说明
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pins
          path: dist/pins.txt
          if-no-files-found: error
          retention-days: 14

  # 只有这一步拿写权限：下三个平台的附件，建发版、传上去。不检出仓库、不跑别人的代码。
  release:
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: miyu-app-*
          merge-multiple: true
          path: out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pins
          path: pins
      - name: 传进发版
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          tag="${GITHUB_REF#refs/tags/}"
          notes="$(printf '没签名的测试版。\n\n%s\n' "$(cat pins/pins.txt)")"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --prerelease --title "Miyu $tag" --notes "$notes" || true
          gh release upload "$tag" out/* --clobber
