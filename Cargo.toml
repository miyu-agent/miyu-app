[package]
name = "miyu-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
description = "Miyu 的托盘程序：常驻的托盘图标，起停核心、用浏览器打开网页界面"
publish = false

# 托盘、事件循环、对话框钉死版本：托盘和菜单的行为跟着它们变，升级单独做一步、三个平台再手测一遍。
# tray-icon、tao 是 Tauri 自己用的托盘和事件循环（施工 AP-2：Tauri 换成它们，不要网页视图）。
[dependencies]
tao = { version = "=0.37.2", default-features = false }
# Linux 上走 ksni 后端（直接说 StatusNotifierItem，施工 AP-3，2026-11-04 项目主人定）：左键报得上来，不要 libayatana-appindicator；
# 代价是多一套 D-Bus 的 zbus（纯 Rust）。Windows、macOS 不受这个特性影响。
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"] }
# 系统原生的消息框（关于、出错）。Linux 上用 GTK 画（tao 本来就要 GTK），不用默认的 xdg 门户那一套。
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3"] }
# 系统通知（施工 AP-4）：Linux 走会话 D-Bus 的 org.freedesktop.Notifications（zbus，同 ksni 那一套），macOS 走 NSUserNotificationCenter，
# Windows 走 WinRT 的 toast。钉死版本：点了通知回不回得来跟着它变，升级要三个平台再手测。
notify-rust = "=4.18.2"
# 盯数据根的 `run/`（别人把核心拉起来了）、单实例「请打开」的文件。
notify = "8.2.1"
# 编进程序的 PNG 解成托盘库要的 RGBA。
png = "0.18.1"
# 用系统的文件管理器打开日志的文件夹。
open = "5.4.5"
serde_json = "1.0.154"
sys-locale = "0.3.2"
# 连核心（门面 miyu-client 的 `connect`）要的异步运行时。
tokio = { version = "1.54.1", features = ["io-util", "rt", "sync", "time"] }
toml = "1.1.8"
# 核心照 git 依赖钉住一个提交（同网页仓库的做法、同 pins.toml 的核心）：升级就是改这里的 rev 和 pins.toml、过三台 CI。
# 只经门面用：找数据根、资源目录，连核心，拉起核心。
miyu-client = { git = "https://github.com/miyu-agent/miyu", rev = "61f1f3ef27852a8a2ae3a37cb3bb29be8da9b4dc" }

# 测试里拿暂停的时钟试「问不出话」（过了 rpc::SLOW 才回的），不用真等；两头一起跑用 `join!`。
[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "test-util"] }

# 「开机时启动」写当前用户的 Run 注册表项。
[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[lints.rust]
unsafe_code = "forbid"
# 不吞错误：必须处理的返回值不许不理。
unused_must_use = "deny"

[lints.clippy]
# 不吞错误：不许用 `let _ =` 或 `.ok()` 把错误悄悄扔掉。真要扔，写 #[expect(..., reason = "...")]。
let_underscore_must_use = "deny"
unused_result_ok = "deny"
# 读到坏数据要报错，不能直接崩。测试里允许，见 clippy.toml。
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = true
strip = true
